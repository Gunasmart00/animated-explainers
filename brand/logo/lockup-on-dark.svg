  <use href="#mark" x="20" y="20" width="360" height="360"/>
  <text x="400" y="250" font-family="'Bricolage Grotesque', 'Segoe UI', sans-serif" font-size="150" fill="#E6F4E8"><tspan font-weight="300">lowkey</tspan><tspan font-weight="800">genius</tspan></text>
</svg>
