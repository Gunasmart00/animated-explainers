<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <title>Lowkey Genius horizontal logo (for dark backgrounds)</title>
  <symbol id="mark" viewBox="0 0 100 100">
    <circle cx="50" cy="44" r="25" fill="#6CFF2E"/>
    <ellipse cx="50" cy="44" rx="44" ry="13" fill="none" stroke="#E6F4E8" stroke-width="2.5" transform="rotate(-18 50 44)"/>
    <circle cx="79.5" cy="25.6" r="4.5" fill="#6CFF2E"/>
    <ellipse cx="50" cy="46" rx="13" ry="8" fill="#FFFFFF"/>
    <circle cx="50" cy="48.5" r="5" fill="#08110B"/>
    <path d="M37 46 A13 8 0 0 1 63 46 Z" fill="#08110B"/>
    <path d="M34 46 L66 46" stroke="#08110B" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="39" y="72" width="22" height="7" rx="2" fill="#E6F4E8"/>
    <rect x="42" y="82" width="16" height="6" rx="3" fill="#E6F4E8"/>
