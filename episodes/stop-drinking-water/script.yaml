title: "What Happens When You Stop Drinking Water"
preset: explainer
structure: hook
hook: "The moment you stop drinking water, your body starts fighting to survive."
# Owner brief 2026-10-18: from first thirst to dangerous organ stress; realistic (accurate) and easy to understand.
# v2 (owner 2026-10-18): fun version. A girl on a sunny park date; thirst makes her cranky with her boyfriend
# (backed by the study: mood effects were greater in women); ends by asking viewers to send it to their girlfriend.
# Bright, cheerful, accurate: inner views on a featureless anatomical hologram beside her (she stays fully clothed;
# a see-through woman was refused by Flow's policy filter), organs at their real size and place (story.md). v1 is in _v1/.
# Loop: the last line runs into the first ("...and send her this. Because" -> "The moment you stop drinking water...")
# and the last clip ends on the first clip's first frame.
caption: |
  Your body has a whole emergency plan for when you stop drinking water. 💧
  Thirst, dark pee, headaches, a racing heart... and a very confused boyfriend. 😅
  Feeling dizzy or confused in the heat? That's an emergency: drink, cool down and get help.

  Follow @howzit.explains for how things work in under a minute.
  Send this to your girlfriend. 💧👇
hashtags: [humanbody, dehydration, sciencefacts, couplegoals, howthebodyworks]
cover_text: "Why she's cranky"
alt_text: "Bright 3D animation of a young woman on a sunny park date with a glowing anatomy hologram showing what happens inside her body: her brain triggers thirst, her kidneys hold on to water, she gets cranky with her boyfriend, her heart beats faster and her kidneys struggle as dehydration gets worse, until he hands her a bottle of water."

voiceover: audio/voiceover.mp3   # ElevenLabs, Mark - Natural Conversations, Eleven v4, speed 1.00 (owner, 2026-10-18)
flow_style: |                   # owner picked style B from images/style-samples (2026-10-18): soft stylised 3D, less cartoon
  Soft stylised 3D animation in a high-end animated-film look: natural adult body proportions with a normal head size, only slightly larger expressive eyes, softly stylised faces with clean simplified detail, smooth skin with subtle texture, realistic hair and clothes with clean simplified folds. Objects, vehicles, plants and buildings have realistic shapes and proportions with clean, simplified materials. Inner-body views look like a bright, clean, anatomically accurate 3D medical illustration on a soft light-teal glow, organs in natural healthy colours. Bright, soft, cheerful sunny lighting with gentle shadows; clean saturated colours (sunny yellow, teal, mint, fresh green, warm golden light). Smooth, fluid, natural motion with believable weight and gentle easing; the camera moves smoothly, never shakes or jumps. Every character keeps exactly the same face, hair, clothes and colours for the whole clip. Not a big-headed cartoon, not chibi, not photorealistic, not live action, not 2D, not gritty, not dark.
style_reference: images/style-samples/style-B.jpg   # attach in Flow as the reference for both characters and the look
flow_lengths: [8]               # Veo 3.1 Fast on this plan only makes 8 s clips
flow_ingredients: false         # one character, described in full in every prompt
loop: true

characters:
  - name: "the young woman"
    look: "a cheerful young Indian woman in her mid-20s (soft stylised 3D, natural proportions), long shiny black hair in a high ponytail with a small yellow hair tie, light-brown skin, warm brown eyes, a bright yellow T-shirt, light-blue knee-length denim shorts, white sneakers, a small mint-green crossbody bag; she looks exactly the same in every shot"
    size: "1.60 m tall adult woman"
  - name: "the boyfriend"
    look: "a friendly young Indian man in his mid-20s (soft stylised 3D, natural proportions), short neat black hair, light-brown skin, a warm smile, a teal T-shirt, beige chinos, white sneakers; he looks exactly the same in every shot"
    size: "1.75 m tall adult man; she comes up to about his chin"

objects:
  - name: "the water bottle"
    look: "a plain 750 ml clear reusable water bottle with a mint-green cap, no label, no writing"
    size: "about 24 cm tall and 7 cm wide; about as long as her forearm"
  - name: "the body hologram"
    look: "a glowing, translucent pale-blue holographic medical diagram of a standing human figure floating in the air, like a hospital 3D anatomy display; inside it, ONLY these organs, each shown exactly once and in its true place: ONE brain inside the skull (and nowhere else), ONE fist-sized heart in the middle of the chest behind the breastbone, slightly left, and TWO bean-shaped kidneys at the back of the belly on either side of the spine just below the ribs; no other organs and no duplicates; body water glows cheerful bright blue inside it"
    size: "exactly the same height as her (1.60 m), standing beside her at the same distance from the camera so its head is level with her head; every organ inside it at its true size"
  - name: "the hypothalamus"
    look: "a small rounded almond-shaped region at the base of the brain, just above the brainstem, with the pea-sized pituitary gland hanging directly below it on a short thin stalk"
    size: "hypothalamus about the size of an almond (about 2 cm); pituitary about the size of a pea (about 1 cm); both tiny compared with the whole brain (about 15 cm long)"
  - name: "the kidneys"
    look: "two reddish-brown bean-shaped kidneys against the back wall of the belly on either side of the spine, just below the lowest ribs, each with a thin tube (ureter) running down to the bladder"
    size: "each kidney about the size of her fist (about 10-11 cm long), the left one slightly higher than the right"
  - name: "the heart"
    look: "a realistic-shaped heart (not a symbol), in the middle of the chest behind the breastbone, tilted slightly to the left, with the big blood vessels on top"
    size: "about the size of her fist (about 12 cm long)"

setting: "a bright, cheerful city park on a hot sunny summer afternoon: green lawns, colourful flower beds, a teal-and-yellow ice-cream cart, palm trees, a clear blue sky with a few small white clouds, warm golden sunshine, sharp clean shadows"

facts:
  - claim: "An adult body is about 55-65% water"
    sources: ["https://www.ncbi.nlm.nih.gov/sites/books/NBK555956/", "https://www.usgs.gov/special-topic/water-science-school/science/water-you"]
  - claim: "Blood gets more concentrated as you lose water; sensors in the hypothalamus detect it and trigger thirst"
    sources: ["https://www.ncbi.nlm.nih.gov/sites/books/NBK555956/", "https://www.msdmanuals.com/home/kidney-disorders/water-balance/dehydration"]
  - claim: "Thirst doesn't appear until you're about 1-2% dehydrated"
    sources: ["https://today.uconn.edu/2012/02/even-mild-dehydration-can-alter-mood/", "https://www.ncbi.nlm.nih.gov/sites/books/NBK555956/"]
  - claim: "The brain releases vasopressin (ADH), which makes the kidneys hold on to water, so urine gets darker and scarcer"
    sources: ["https://my.clevelandclinic.org/health/body/23150-posterior-pituitary", "https://my.clevelandclinic.org/health/diseases/9013-dehydration"]
  - claim: "Mild dehydration brings headaches, tiredness and trouble concentrating"
    sources: ["https://today.uconn.edu/2012/02/even-mild-dehydration-can-alter-mood/", "https://my.clevelandclinic.org/health/diseases/21517-dehydration-headache"]
  - claim: "Mild dehydration lowers mood, and in the study the mood changes were substantially greater in women than in men"
    sources: ["https://today.uconn.edu/2012/02/even-mild-dehydration-can-alter-mood/", "https://www.painscience.com/biblio/mild-dehydration-affects-mood-in-healthy-young-women.html"]
  - claim: "Blood volume falls, the heart beats faster, standing up can make you dizzy"
    sources: ["https://www.ncbi.nlm.nih.gov/sites/books/NBK555956/", "https://www.msdmanuals.com/home/kidney-disorders/water-balance/dehydration"]
  - claim: "You sweat less and can overheat"
    sources: ["https://www.msdmanuals.com/home/kidney-disorders/water-balance/dehydration", "https://my.clevelandclinic.org/health/diseases/9013-dehydration"]
  - claim: "Water is pulled out of cells, including brain cells; confusion is a sign of severe dehydration"
    sources: ["https://www.msdmanuals.com/home/kidney-disorders/water-balance/dehydration", "https://www.ncbi.nlm.nih.gov/sites/books/NBK555956/"]
  - claim: "With less blood reaching them, the kidneys can be injured and fail"
    sources: ["https://www.ncbi.nlm.nih.gov/sites/books/NBK555956/", "https://www.medicalnewstoday.com/articles/325174"]
  - claim: "Most people survive only about 3 days without water, less in heat"
    sources: ["https://www.medicalnewstoday.com/articles/325174", "https://www.healthline.com/health/food-nutrition/how-long-can-you-live-without-water"]

scenes:
  - id: s01
    narration: "The moment you stop drinking water, your body starts fighting to survive."
    characters: ["the young woman"]
    shot: '0-1.2 s: close-up of the young woman in the sunny park tipping her water bottle up to drink; the bottle is completely empty and dry inside, only one tiny drop drips out, and she lowers the bottle and peers into it with a comic pout; 1.2-4.2 s: with a sparkly shimmer, the body hologram appears in the air right beside her at her own height; it fills with cheerful glowing bright-blue body water and its fist-sized heart beats behind the breastbone, slightly to the left; she leans back and blinks at it, surprised.'
    camera: close-up on her face and the bottle, then a gentle pull-back to show her and the hologram beside her
    opens: close-up of the young woman in the bright sunny park tipping her water bottle up to drink, ponytail swinging, flower beds behind her
    ends: medium shot of the young woman next to the glowing body hologram in the sunny park, the hologram's heart beating behind its breastbone
    sfx: an empty bottle gurgle, a single drip, a cheerful park ambience with birds, a sparkly whoosh as the hologram appears, a steady heartbeat
    must: ["the bottle is completely empty, with no water visible inside it", "the hologram is exactly her height, its head level with hers", "the hologram has exactly one brain, inside its head", "bright cheerful sunshine", "the heart is behind the breastbone, slightly left, fist-sized"]
    never: ["a second brain or any brain outside the head", "a hologram taller than her", "a heart symbol shape", "text or labels", "dark or gloomy light"]
  - id: s02
    vo_start: 4.25
    narration: "You're about sixty percent water, and you're losing it every minute."
    characters: ["the young woman"]
    start_frame: "s01@4.25"         # continuity: same hologram and framing as the end of s01's used part
    shot: 'Continue exactly from the start frame (the young woman beside the body hologram in the sunny park). 0-1.5 s: the body hologram fills with glowing bright-blue water from its feet up to a little above its waist, like a glass filled a bit more than halfway, while she watches it with curiosity; 1.5-3.8 s: tiny sparkling droplets of sweat lift off her forehead and arms and float away into the warm air, a faint puff of breath leaves her mouth, and the glowing blue water level inside the hologram dips slightly lower.'
    camera: starts exactly on the start frame, then a very slow, gentle push-in on the two of them
    opens: exactly the start frame (the young woman holding her bottle beside the glowing body hologram)
    ends: the glowing blue water level inside the hologram slightly lower, tiny sweat drops floating off the young woman's skin
    sfx: a soft watery slosh, tiny fizzing pops as sweat drops evaporate, a light breath out, birdsong
    must: ["the blue water fills a bit more than half of the hologram's body", "the drops are tiny compared with her"]
    never: ["text, numbers or a gauge with markings"]
    popups:
      - { text: "60%", at_word: "sixty" }
  - id: s03
    vo_start: 8.05
    narration: "So your blood gets saltier. A sensor deep in your brain notices, and makes you thirsty."
    characters: ["the young woman"]
    shot: 'One continuous camera journey in a bright, clean medical-illustration look. 0-1.5 s: macro view inside a bright, well-lit blood vessel: red blood cells flowing in clear pale-yellow plasma as tiny white sparkling salt specks get more crowded between them; 1.5-3.2 s: the camera follows the flow up into the brain to the hypothalamus at its base, which lights up with a soft green glow and sends a bright pulse; 3.2-5.4 s: the camera pulls back out through her face in the sunny park: the young woman swallows hard and touches her throat, clearly thirsty; 5.4-8 s: she shakes her empty bottle next to her ear and gives it a comically dramatic frown.'
    camera: macro tracking shot inside the blood vessel, rising into the brain, then a smooth pull-back out to a close-up of her face
    opens: macro view inside a bright blood vessel, red blood cells flowing in clear pale plasma
    ends: close-up of the young woman frowning at her empty bottle in the bright sunny park
    sfx: a soft whooshing blood flow, a bright electric ping as the hypothalamus lights up, a dry swallow, the empty bottle rattling
    must: ["the hypothalamus is a tiny almond-sized spot at the base of the brain", "red blood cells only appear in the macro view inside the vessel", "bright, clean lighting inside the body"]
    never: ["giant blood cells next to organs", "text or labels", "dark or scary inner views"]
  - id: s04
    vo_start: 13.52
    narration: "But by then, you've already lost one to two percent."
    clip: clips/s03.mp4
    clip_start: 5.4
    popups:
      - { text: "1–2%", at_word: "one" }
  - id: s05
    vo_start: 16.76
    narration: "Your brain also tells your kidneys: hold on to every drop. So your pee turns dark."
    characters: ["the young woman"]
    shot: 'One steady close-up of the lower back of the glowing blue body hologram (seen from behind, on a bright light-teal glow): the spine runs down the middle, the lowest ribs at the top of the frame, EXACTLY TWO bean-shaped reddish-brown kidneys sit either side of the spine just below the ribs, a thin tube runs down from each kidney to ONE small round bladder at the bottom of the frame. 0-1.8 s: a stream of glowing golden hormone sparks flows down the big blood vessel beside the spine from the top of the frame (coming from the brain) and reaches the kidneys; 1.8-3.8 s: both kidneys light up and soak glowing blue water back into the blood vessels like sponges, the blue flowing back up and out of the frame; 3.8-5.7 s: only a thin trickle runs down the two tubes into the bladder, and the liquid in the bladder turns from pale straw yellow to dark amber.'
    camera: steady close-up of the lower back with a very slow, gentle push-in; the camera never moves up to the chest or head
    opens: "close-up of the lower back of the glowing blue hologram (spine, two kidneys below the ribs, bladder at the bottom)"
    ends: the two kidneys glowing, the small bladder below them filled with dark amber liquid
    sfx: a sparkling chime as the hormone is released, a rushing flow, a soft suction slurp as the kidneys pull water back, a liquid swirl
    must: ["exactly two kidneys in the whole frame, one either side of the spine just below the ribs", "one small bladder below them", "no heart, lungs or brain in the frame"]
    never: ["a third or fourth kidney", "kidneys next to the heart", "a toilet", "a bathroom", "any cut to another place", "text or labels"]
  - id: s06
    vo_start: 22.49
    narration: "Even now, headaches kick in, you feel tired, and it's hard to focus."
    characters: ["the young woman"]
    shot: 'One continuous shot in the sunny park. 0-1.8 s: the young woman sits on a bright park bench rubbing her temples while a soft red throbbing glow pulses at her forehead; 1.8-3 s: she lets out a big yawn, shoulders sagging; 3-4.4 s: she squints at the bright park as the background goes briefly blurry, then sharp again.'
    camera: medium shot of the bench, slow push-in on her tired face
    opens: medium shot of the young woman on a bright park bench rubbing her temples, flower beds behind her
    ends: close-up of the young woman squinting, tired, on the bench in the bright park
    sfx: birdsong, a dull throbbing pulse, a long yawn, distant happy park sounds
    must: ["bright cheerful sunshine"]
    never: ["text or labels"]
  - id: s07
    vo_start: 26.93
    narration: "Your mood drops too, and one study found women feel it even more. Sorry, boyfriends."
    characters: ["the young woman", "the boyfriend"]
    start_frame: "s06@4.44"         # continuity: her on the bench, exactly as s06 leaves her
    shot: 'Continue exactly from the start frame (the young woman sitting tired on the park bench). 0-2 s: her boyfriend walks into the frame from the right along the path with a big happy smile, holding out two ice-cream cones toward her and chattering cheerfully; 2-4 s: she turns her head to him and shoots him a furious glare with her arms crossed, while a tiny cartoon storm cloud with a little lightning flicker appears just above her head; 4-5.9 s: he freezes mid-smile, then slowly backs away with his hands up and a nervous grin, the ice creams wobbling.'
    camera: smooth pull-back from her on the bench to a two-shot as he arrives, then a slight push-in on his nervous face
    opens: exactly the start frame (the young woman sitting tired on the bench)
    ends: two-shot of the young woman glaring with arms crossed and the boyfriend backing away with his hands up, holding two ice-cream cones
    sfx: cheerful footsteps on a path, happy humming, a comic thunder rumble from the tiny cloud, a nervous gulp, birdsong
    must: ["when both stand, she comes up to about his chin; with her sitting on the bench, her head is at about his chest height", "bright cheerful sunshine", "the storm cloud is tiny, just above her head"]
