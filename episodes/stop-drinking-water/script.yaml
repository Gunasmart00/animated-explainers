    opens: bright macro view of plump round cells full of sparkling blue water
    ends: close-up of the young woman's confused face in the bright sunny park
    sfx: soft squeezing and shrinking sounds, a faint sparkly flicker, a light dizzy ringing hum
    must: ["the cells are seen in a macro view only", "bright, clean, cheerful lighting"]
    never: ["text, letters or a real question mark symbol", "blood or gore"]
  - id: s11
    vo_start: 45.5
    narration: "Your kidneys, starved of blood, start shutting down."
    graded_from: "s05@4.2"           # no Flow credits: s05's kidneys, 3.8 s, faded to grey with a red warning pulse (ffmpeg)
