  - id: s08
    vo_start: 32.78
    narration: "There's less blood, so your heart races to keep up. Stand up fast? Dizzy."
    characters: ["the young woman"]
    shot: '0-2.2 s: close-up of the chest of the body hologram on a light-teal glow: the fist-sized heart behind the breastbone pumps faster and faster while the red blood in the vessels around it flows thinner; 2.2-5.2 s: the hologram fades away: the young woman, sitting on the park bench in the sun, stands up quickly, wobbles, and puts a hand to her head as cartoon stars circle once around her head; 5.2-7.8 s: she steadies herself in the bright sun; the sweat on her skin dries up and stops, her cheeks and arms flush pink-red, and a warm orange heat glow builds over her as heat waves shimmer around her.'
    camera: close-up on the beating heart, then a pull-back to a medium shot as she stands and wobbles
    opens: close-up of the body hologram's chest, the heart beating behind the breastbone on a light-teal glow
    ends: medium shot of the young woman standing in the bright sunny park, cheeks flushed, orange heat glow around her
    sfx: a heartbeat speeding up, a bench creak as she stands, a woozy slide-whistle as she wobbles, a rising sizzle of heat
    must: ["the heart is fist-sized behind the breastbone", "her sweat stops and dries"]
    never: ["a heart symbol shape", "text or labels"]
  - id: s09
    vo_start: 37.99
    narration: "You sweat less, so you start to overheat."
    clip: clips/s08.mp4
    clip_start: 5.2
  - id: s10
    vo_start: 40.53
    narration: "Then water gets pulled out of your cells, even your brain's, and you get confused."
    characters: ["the young woman"]
    clip_end: 3.95                  # v1's last 0.7 s showed her smiling in jeans (wrong mood and clothes): use the cells only, slowed to fit
    shot: '0-2 s: bright macro view of plump round body cells on a light background; sparkling blue water is drawn out through their walls into the surrounding blood and the cells shrink and wrinkle like grapes turning into raisins; 2-3.5 s: the camera glides to brain cells with long branches, which shrink the same way as their glow flickers; 3.5-4.8 s: cut out to the young woman in the sunny park, eyes unfocused, slowly turning her head as if she forgot where she was, a little question-mark-shaped swirl of sparkles circling her head.'
