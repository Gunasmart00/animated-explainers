title: "Why Fast Food Logos Are Red and Yellow"
preset: explainer
structure: hook
hook: "Almost every fast food logo is red and yellow... on purpose."
caption: |
  Ever wonder why almost every fast food logo uses the exact same colors? 🍟🍔
  It's called the Ketchup and Mustard Theory. And wait till you see why Starbucks went green.
  
  Follow @howzit.explains for daily 3D explainers!
  What's your go-to fast food spot? 👇
hashtags: [fastfood, marketing, psychology, didyouknow, foodfacts]
viral_hashtags: [shorts, viral, fyp, trending, learnontiktok, business, secrets, lifehacks, facts, mindblowing, animation, design, branding, psychologyfacts, explore]
cover_text: "THE FAST FOOD COLOR TRAP"
alt_text: "Stylized 3D animation showing glowing red and yellow fast food signs, a brain cutaway reacting to color psychology, and the hidden reason behind green branding like Starbucks."

voiceover: audio/voiceover.mp3
music: true                      # licensed upbeat music bed, low under voice; no whoosh on cuts
flow_style: |
  Soft stylised 3D animation in a high-end animated-film look: natural adult body proportions with slightly larger expressive eyes, softly stylised faces with clean simplified detail, smooth skin, realistic casual clothing with clean simplified folds. Urban fast food street scenes are bright, warm and vibrant with saturated neon red and yellow glows, deep twilight blue sky for contrast, reflections on clean pavements and car glass. Food cutaways are clean, appetizing, graphic 3D cross-sections. Smooth, fluid cinematic camera motion with gentle easing, never jittery or shaky. Every character and setting maintains consistent model look across shots. Not chibi, not 2D, not gritty, not photorealistic.
style_reference: ../stop-drinking-water/images/style-samples/style-B.jpg
flow_lengths: [8]
loop: true

characters:
  - name: "the hungry driver"
    look: "a funny, relatable young man in his mid-20s (soft stylised 3D, natural proportions), short messy brown hair, friendly face with big expressive hazel eyes, wearing a burnt-orange hoodie over a white tee; highly expressive comedic facial reactions"
    size: "1.75 m tall adult man"

objects:
  - name: "the sneaky green cup"
    look: "a cute little green iced cup with a dome lid, green straw, and tiny smiling face drawn on it, wearing dark sunglasses"
    size: "standard coffee cup size on the dashboard"
  - name: "the neon signs"
    look: "stylized vibrant neon restaurant signs in bold crimson red and warm golden yellow with burger, fries, and taco icons; no copyrighted trademarked logos"
    size: "towering billboard roadside signs"

setting: "a vibrant, modern city food boulevard at twilight with glowing red and yellow signs, alternating with a stylized car interior and graphic brain cross-section"

facts:
  - claim: "Fast food chains universally use red and yellow in branding (Ketchup and Mustard Theory)"
    sources: ["https://www.businessinsider.com/fast-food-red-and-yellow-logos-ketchup-mustard-theory-2018-8", "https://www.colourstudies.com"]
  - claim: "Red increases heart rate and triggers appetite and impulsive cravings"
    sources: ["https://graphicdesignblog.org", "https://www.colourstudies.com"]
  - claim: "Yellow is the most visible daylight color from long distances on highways and evokes warmth"
    sources: ["https://karenhaller.com", "https://www.businessinsider.com/fast-food-red-and-yellow-logos-ketchup-mustard-theory-2018-8"]
  - claim: "The red-yellow combination creates urgency encouraging quick eating and rapid table turnover"
    sources: ["https://econlife.com", "https://ailogocreator.io"]
  - claim: "Blue suppresses appetite because naturally occurring blue food is rare and signals poison"
    sources: ["https://www.psychologytoday.com/us/blog/sensory-marketing/why-blue-suppresses-appetite", "https://www.webmd.com"]
  - claim: "Subway and Starbucks use green to project health and relaxation so customers linger"
    sources: ["https://karenhaller.com", "https://brandstolife.com.au"]

