    narration: "Red raises your heart rate and tricks your brain into feeling instant hunger."
    characters: ["the hungry driver"]
    shot: "0-2.5 s: stylized 3D translucent anatomical cutaway of the driver's head and chest: glowing red pulses travel up from his beating heart into his brain's appetite center. 2.5-4.5 s: the appetite center lights up like a hungry red neon burger icon pulsing with energy."
    camera: "smooth push-in into graphic 3D cross-section"
    sfx: "thumping heartbeat: thump-thump thump-thump, energetic electric pulse sizzle"
    popups:
      - { text: "+HEART RATE", at_word: "rate", color: lime }
