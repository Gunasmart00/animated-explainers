    must: ["camera zooms in continuously from wide opening", "bright vivid red and yellow neon glows", "no real-world trademark text"]
    never: ["gloomy or dark shadows", "static camera"]

  - id: s02
    clip: clips/visual.mp4
    clip_start: 4.32
    clip_end: 8.25
    vo_start: 4.32
    narration: "Marketers call it the Ketchup and Mustard Theory, and it's a trap."
    characters: ["the hungry driver"]
    shot: "0-2 s: the driver looks sideways at his dashboard: next to him sits a giant 3D red ketchup bottle and a yellow mustard bottle dancing playfully. 2-4 s: in the cup holder right next to them sits the sneaky green cup wearing sunglasses (Easter egg). The driver taps his chin suspiciously."
    camera: "medium shot inside the car interior, panning smoothly between the condiments and driver"
    sfx: "playful squeak of ketchup bottle, cartoon trap snap"
    easter_egg: "the tiny green iced cup in the cup holder smiling"
    popups:
      - { text: "THE TRAP", at_word: "trap", color: lime }
