    clip: clips/visual.mp4
    clip_start: 0.0
    clip_end: 4.32
    vo_start: 0.0
    narration: "Almost every fast food logo is red and yellow... on purpose."
    characters: ["the hungry driver"]
    shot: "0-1.5 s: WIDE establishing shot of a bustling city boulevard at dusk, glowing giant red and yellow fast-food signs towering above the road; camera is already zooming in rapidly toward a car stopped at the light. 1.5-3 s: camera punches in through the windshield to the hungry driver staring up with huge round eyes, jaw dropped in comic hunger, drool almost forming. 3-4.5 s: reflections of bright yellow french fries and red burger signs dance across his eyes."
    camera: "starts wide from high boulevard angle and zooms steadily into a close-up of the driver's stunned face"
    opens: "wide establishing shot of the glowing fast food strip at dusk"
    ends: "close-up of the driver's hungry face with neon glow"
    sfx: "distant city traffic hum, soft neon sign buzz, stomach growl rumble"
