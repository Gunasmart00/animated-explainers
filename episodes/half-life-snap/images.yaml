      suddenly empty. Only half of the pigeons remain. In the row of planters, every other tree is gone, leaving bare
      soil. THE EVERYMAN stands in the middle, hand still raised, eyes wide, jaw dropped.
      No smoke, no dust, no glow, no injuries: people are simply not there any more.
      Bright, flat, even daylight, cool blue palette, sharp focus. Not a cartoon, not Pixar, not a photograph. No text.

  S3:   # C3 start: the planet gets quieter (seismograph)
    aspect: "9:16"
    prompt: |
      Realistic 3D video-game cutscene still, vertical 9:16.
      A plain game-level science lab: sky-blue walls, a white ceiling with one spotlight, a grey desk. On the desk a
      drum seismograph: a slowly turning paper drum and a thin needle arm. The needle has drawn a band of big, busy
      zig-zags on the left part of the paper that shrinks into a calm, almost flat line on the right. Close, high
      three-quarter view on the needle and paper.
      Bright, flat, even light, cool blue palette with the needle's arm in orange, sharp focus, low-detail textures.
      Not a cartoon, not a photograph. No text, no numbers, no grid labels on the paper.

