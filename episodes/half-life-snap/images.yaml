# Image jobs (by hand: output/half-life-snap_image_prompts.md; or tools/gen_image.py). Zack style refs added automatically.
model: gemini-nano-banana-2.1
size: 2K
style: [people, sets]
style_max: 1
images:
  cast:
    aspect: "16:9"
    prompt: |
      A character and creature line-up for a 3D animation, all drawn to the SAME real-world scale, side view, on a
      plain light-blue studio background, bright even light, sharp focus:
      1. THE EVERYMAN: a man in his early 30s, short dark-brown hair, light stubble, a plain grey T-shirt, blue jeans,
         white sneakers; a small bright ORANGE pocket hand-sanitiser bottle clipped to his front belt loop; 1.78 m tall.
         Standing on the left, right hand raised mid finger-snap.
      2. THE PUMA: an adult puma (mountain lion), plain tawny coat, pale belly, black-tipped tail; 0.7 m tall at the
         shoulder (reaches the man's hip), about 2.2 m long including the tail.
      3. THE GOAT: a wild Kashmiri goat, long shaggy cream-and-grey coat, long backward-curving horns, beard;
         0.7 m tall at the shoulder (the man's hip).
      Realistic proportions, realistic face with normal-sized eyes, realistic animals (not cute, not cartoon). No
      text, no logos, no labels, no numbers.

  S1:   # C1 start (hook) and the END frame of C8 (loop). Easter egg: the orange sanitiser on his belt loop.
    aspect: "9:16"
    refs: ["images/cast.jpg"]
    prompt: |
      The first attached image is our cast line-up: use exactly this man (same face, hair, grey T-shirt, jeans,
      orange sanitiser bottle on his belt loop).
      Realistic 3D video-game cutscene still, vertical 9:16.
      A busy, plain game-level city crosswalk seen from a high three-quarter angle: flat light-grey road with white
      zebra stripes, plain sky-blue and teal building walls with simple windows, a few plain trees in square planters,
      a red city bus at the kerb, pigeons on the pavement, about twenty people in plain solid-colour T-shirts crossing.
      In the middle of the crowd, facing the camera, THE EVERYMAN raises his right hand at chest height, thumb and
      middle finger pressed together, just about to snap; calm, curious face. The small orange bottle on his belt loop
      is visible but not centred.
      Bright, flat, even daylight, a cool blue palette with the red bus and the orange bottle as the only warm colours,
      everything in sharp focus, low-detail textures. Not a cartoon, not Pixar, not a photograph. No text, no logos,
      no numbers, no writing on the bus or buildings.

  S2:   # C2 start: half the street gone
    aspect: "9:16"
    refs: ["images/cast.jpg", "images/s1.jpg"]
    prompt: |
      The first attached image is our cast line-up; the second is our approved opening shot: keep the same street,
      bus, buildings, light and rendering look.
      Realistic 3D video-game cutscene still, vertical 9:16.
      The same crosswalk a moment later, same high angle: HALF of the people are gone, leaving wide gaps in the crowd;
