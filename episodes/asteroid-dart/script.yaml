caption: |
  If an asteroid was heading for Earth... could we actually stop it? 🤔☄️
  NASA tested it for real.

  Follow @howzit.explains for space stories you won't believe.
  Did you know we already moved one? 👇
hashtags: [nasa, asteroid, space, dart, science]
