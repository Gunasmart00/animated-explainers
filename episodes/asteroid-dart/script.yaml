cover_text: "COULD WE STOP IT?"
alt_text: "3D animation: an asteroid heads for Earth; a movie-style missile misses it; NASA engineers build a vending-machine-sized spacecraft that flies seven million miles and smashes into a harmless asteroid moonlet at 14,000 mph; its orbit shrinks by 32 minutes instead of the 73 seconds needed."
voiceover: audio/voiceover.mp3   # owner, ElevenLabs Mark, 42.92 s

facts:
  - claim: "DART hit the asteroid moonlet Dimorphos on 26 Sep 2022 at about 14,000 mph, about 7 million miles from Earth; DART was vending-machine sized"
    sources: ["https://www.foxnews.com/science/nasas-dart-spacecraft-slams-asteroid-knock-off-path.amp", "https://www.sciencenews.org/article/dart-mission-deflected-asteroid-for-planetary-defense"]
  - claim: "Dimorphos is about 525 ft across (football-stadium size) and poses no threat to Earth"
    sources: ["https://www.foxnews.com/science/nasas-dart-spacecraft-slams-asteroid-knock-off-path.amp", "https://www.sciencenews.org/article/dart-mission-deflected-asteroid-for-planetary-defense"]
  - claim: "Success needed a 73-second orbit change; the orbit shortened by 32 minutes (11 h 55 min to 11 h 23 min)"
    sources: ["https://www.sciencenews.org/article/dart-mission-deflected-asteroid-for-planetary-defense", "https://www.universetoday.com/158049/success-dart-impact-shortened-asteroids-orbit-time-by-32-minutes/"]

