title: "Why McDonald's Ice Cream Machine Is Always Broken"
preset: explainer
structure: hook
hook: "Why is the McDonald's ice cream machine ALWAYS broken?"
# Owner pick 2026-10-21. Business "so that's why". Rules: docs/owner-creative-rules.md. Workflow: docs/owner-flow-workflow.md
# Payoff ("they usually mean cleaning") held back to s08; twist (US government, 2024 repair right) in s09-s10; loops to s01.
# Easter egg: the small hourglass on the machine from the first frame = the up-to-4-hour cleaning cycle (s06).
# Visuals are brand-free (no logos, no golden arches, no text); the brand is only in the voiceover.
caption: |
  Why is the McDonald's ice cream machine ALWAYS broken? 🍦
  It's usually not broken at all. Watch till the end: the US government had to step in.

  Follow @howzit.explains for how things work in under a minute.
  Has it ever been "broken" for you? 👇
hashtags: [mcdonalds, icecream, mcflurry, fastfood, businessfacts]
viral_hashtags: [viral, fyp, foryou, explore, explorepage, trending, didyouknow, facts, funfacts, mindblown, learnsomethingnew, foodie, explained, 3danimation, lifehacks]
cover_text: "IT'S NOT BROKEN"
alt_text: "Bright 3D animation of a fast-food soft-serve machine: a kid is told it's broken, a map shows broken machines across town, an x-ray shows the machine heating and freezing itself clean overnight, a technician unlocks it with a code, and a government stamp finally lets restaurants fix their own machines."

voiceover: audio/voiceover.mp3   # owner, ElevenLabs Mark - Natural Conversations, 55.56 s
music: true                      # add a licensed track in-app when posting

facts:
  - claim: "More than 1 in 10 US McDonald's can't serve ice cream at a given time (McBroken: ~11% 2021, ~15% Oct 2024)"
    sources: ["https://www.bostonglobe.com/2021/09/02/business/why-are-mcdonalds-mcflurry-machines-often-broken-ftc-wants-figure-it-out/", "https://abc7news.com/mcdonalds-restaurants-finally-have-solution-busted-mcflurry-machine-problem/15480610/"]
  - claim: "The nightly heat-clean cycle heats the mix to kill bacteria then cools it, and can take up to 4 hours"
    sources: ["https://www.bostonglobe.com/2021/09/02/business/why-are-mcdonalds-mcflurry-machines-often-broken-ftc-wants-figure-it-out/", "https://tastingtable.com/2191919/mcdonalds-ice-cream-machine-employee/"]
  - claim: "If the cycle fails, a technician with a secret passcode must service it"
    sources: ["https://www.bostonglobe.com/2021/09/02/business/why-are-mcdonalds-mcflurry-machines-often-broken-ftc-wants-figure-it-out/", "https://tastingtable.com/2191919/mcdonalds-ice-cream-machine-employee/"]
  - claim: "From Oct 2024 a US Copyright Office exemption lets restaurants bypass the digital locks to repair the machines"
    sources: ["https://abc7news.com/mcdonalds-restaurants-finally-have-solution-busted-mcflurry-machine-problem/15480610/", "https://rla.org/media/article/news-and-views/public-knowledge-ifixit-free-mcflurry"]

scenes:
