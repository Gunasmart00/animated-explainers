    narration: "Why is the McDonald's ice cream machine ALWAYS broken?"
    popups:
      - { text: "ALWAYS?!", at_word: "ALWAYS", size: 150 }
  - id: s02
    clip: clips/visual.mp4
    clip_start: 3.62
    clip_end: 9.94
    vo_start: 3.62
    narration: "You walk in, you're craving a McFlurry, and... \"Sorry, machine's broken.\" Again."
  - id: s03
    clip: clips/visual.mp4
    clip_start: 9.94
    clip_end: 17.86
    vo_start: 9.94
    narration: "And it's not just you. Right now, more than one in ten in the US are down. There's literally a website tracking it live."
    popups:
      - { text: "1 IN 10", at_word: "ten", color: lime }
  - id: s04
    clip: clips/visual.mp4
    clip_start: 17.86
    clip_end: 23.70
    vo_start: 17.86
    narration: "So what's going on? Okay... milk is basically a buffet for bacteria."
    popups:
      - { text: "?", at_word: "on" }
  - id: s05
    clip: clips/visual.mp4
    clip_start: 23.70
    clip_end: 31.84
    vo_start: 23.70
    narration: "So every single night, the machine cooks itself clean. It heats the mix hot enough to kill the germs, then chills it all the way back down."
  - id: s06
    clip: clips/visual.mp4
    clip_start: 31.84
    clip_end: 34.14
    vo_start: 31.84
    narration: "And that can take up to four hours."
    popups:
      - { text: "UP TO 4 HOURS", at_word: "four" }
  - id: s07
    clip: clips/visual.mp4
    clip_start: 34.14
    clip_end: 41.42
    vo_start: 34.14
    narration: "Oh, and if one tiny step fails? It locks itself. And only a technician with a secret code can unlock it."
    popups:
      - { text: "SECRET CODE", at_word: "code" }
  - id: s08
    clip: clips/visual.mp4
    clip_start: 41.42
    clip_end: 47.47
    vo_start: 41.42
    narration: "So when they say \"broken\"... they usually mean \"cleaning.\" Or \"waiting for that one guy.\""
  - id: s09
    clip: clips/visual.mp4
    clip_start: 47.47
    clip_end: 50.61
    vo_start: 47.47
    narration: "It got so bad, the US government stepped in."
  - id: s10
