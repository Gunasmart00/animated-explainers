title: "How Seatbelts Know When To Lock"
preset: explainer
structure: hook
caption: |
  Pull a seatbelt gently, it rolls smoothly. But yank it fast, and it instantly jams. Here is the dual-locking mechanical secret inside your car's seatbelt! 🚗⚙️

  Follow @howzit.explains for daily 3D animated explainers!

  Did you know seatbelts work completely without electricity?
hashtags: [seatbelt, howitworks, engineering, carhacks, 3danimation]
cover_text: "SEATBELT SECRET"
alt_text: "3D animation showing the internal cross-section of a seatbelt retractor and locking mechanism"
characters:
  - name: "the driver"
    look: "a young adult in a vibrant yellow hoodie and dark denim, expressive face, styled dark hair"
    size: "1.75 m tall adult"
setting: "sunlit modern minimalist car interior, high-key daylight streaming through windshield, pale turquoise and charcoal leather cabin"
facts:
  - claim: "The seatbelt strap wraps around a central spool powered by a spiral spring that maintains constant light tension."
    sources: ["https://auto.howstuffworks.com/car-safety/safety-devices/seatbelt.htm", "https://www.nhtsa.gov/vehicle-safety/seat-belts"]
  - claim: "Emergency Locking Retractors feature two independent mechanical systems: vehicle-sensitive and webbing-sensitive."
    sources: ["https://www.nhtsa.gov/laws-regulations/fmvss", "https://www.bosch-mobility.com/"]
  - claim: "In sudden deceleration, inertia throws a weighted pendulum forward, tipping a metal pawl into a ratchet gear."
    sources: ["https://auto.howstuffworks.com/car-safety/safety-devices/seatbelt2.htm", "https://www.caranddriver.com/features/a15104278/how-seatbelts-work/"]
  - claim: "When yanked rapidly, centrifugal force flings a weighted clutch lever outward, jamming the ratchet teeth."
    sources: ["https://auto.howstuffworks.com/car-safety/safety-devices/seatbelt3.htm", "https://skill-lync.com/"]
  - claim: "Pyrotechnic pretensioners ignite a micro gas charge in severe collisions to pull slack out before occupant moves."
    sources: ["https://www.iihs.org/topics/seat-belts", "https://www.nhtsa.gov/research-data/research-programs/seat-belts"]

scenes:
  - id: s01
    narration: "Pull a seatbelt gently, and it glides smoothly."
    characters: ["the driver"]
    shot: "0-2 s: the driver in a yellow hoodie pulls the dark grey seatbelt slowly across their chest with a smooth, effortless motion; 2-3 s: the belt spools out fluidly in the bright sunlit car interior."
    camera: "medium close-up on the driver from the passenger side, bright daylight"
    sfx: "gentle smooth seatbelt strap sliding sound, quiet interior car ambiance"
    must: ["driver wearing yellow hoodie", "bright daylight through windshield"]
    never: ["dark muddy interior", "jerky motion"]

  - id: s02
    narration: "But yank it fast, and it instantly locks."
    characters: ["the driver"]
    shot: "0-1.5 s: the driver gives the seatbelt strap a sudden, sharp yank; 1.5-3 s: the seatbelt snaps rock-solid with an instant mechanical stop, jarring the driver's hand."
    camera: "tighter close-up on driver's hand gripping the strap as it snaps taut"
    sfx: "sudden sharp fabric snap, loud crisp metallic click"
    popups:
      - { text: "LOCKED", at_word: "locks" }

  - id: s03
    narration: "You might think this uses sensors, but it's pure mechanics."
    shot: "0-1.5 s: camera glides smoothly from the driver's shoulder directly into the car's B-pillar frame; 1.5-3 s: the plastic pillar trim fades transparent, revealing the metal retractor unit."
    camera: "smooth tracking move from driver shoulder into the center door pillar"
    sfx: "subtle mechanical hum, camera zoom whoosh"

  - id: s04
    narration: "Inside the pillar, the belt wraps around a spring-loaded spool."
    shot: "0-2 s: macro 3D cutaway showing the polished steel spool; 2-4 s: the spiral clockwork spring unwinds smoothly as webbing pulls off, glowing with a soft lime outline."
    camera: "macro hero shot of the cylindrical retractor spool and spiral spring"
    sfx: "spring coiled ticking tension, subtle metallic glint"

  - id: s05
    narration: "Inside this spool sits a tiny centrifugal clutch."
    shot: "0-2 s: camera zooms into the hub of the spool, revealing an intricate gear assembly; 2-3 s: a small weighted pivot lever rests against a delicate calibration spring."
    camera: "extreme macro cutaway into the spinning hub assembly"
    sfx: "precision watchmaker gear clicking"

  - id: s06
    narration: "When yanked, centrifugal force flings the weighted lever outward..."
    shot: "0-2 s: the spool spins at high speed; 2-3.5 s: centrifugal force overpowers the tiny spring, swinging the weighted lever violently outward against the housing."
    camera: "slow-motion macro tracking the weighted lever swinging outward"
    sfx: "fast spinning whirr, metallic lever snap"

  - id: s07
    narration: "...catching a heavy ratchet gear that freezes the belt cold."
    shot: "0-1.5 s: the lever's tip catches directly into the teeth of the external ratchet wheel; 1.5-3 s: the entire spool locks with zero rotation as dynamic shockwaves pulse along the strap."
    camera: "macro close-up on the ratchet tooth engagement"
    sfx: "heavy solid steel CLACK impact, mechanical stop"
    popups:
      - { text: "CLUTCH LOCK", at_word: "freezes" }

  - id: s08
    narration: "And during a crash, a weighted steel ball swings forward..."
    shot: "0-2 s: camera shifts down to the base of the retractor; 2-4 s: a heavy chrome ball bearing rests in a conical cup, suddenly thrown forward by rapid car deceleration."
    camera: "isometric cutaway of the inertia pendulum cradle at the retractor base"
    sfx: "car tire screech in distance, heavy steel ball rolling up ramp"

  - id: s09
    narration: "...tripping a second steel arm before you can even move."
    shot: "0-2 s: the rising ball pushes a hardened steel pawl upward; 2-3.5 s: the pawl wedges deep into the main gear teeth, double-locking the belt completely."
    camera: "macro shot showing dual pawls locked simultaneously into the ratchet gear"
    sfx: "sharp dual metallic latch click"
    popups:
      - { text: "INERTIA LOCK", at_word: "second" }

  - id: s10
    narration: "So when you pull it slowly, you're always free to buckle up."
    characters: ["the driver"]
    shot: "0-2 s: camera cuts back to the sunlit cabin; 2-3.5 s: the driver smiles, pulls the strap gently across their chest toward the buckle with a relaxed motion."
    camera: "medium close-up from passenger side, identical framing to s01@0"
    end_frame: "s01@0"
    clip_start: 3.27
    sfx: "gentle seatbelt fabric glide, cheerful cabin tone"
