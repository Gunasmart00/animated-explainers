facts:
  - claim: "Lena Påhlsson of Mora, Sweden lost her white-gold wedding ring with seven small diamonds in 1995 while doing her Christmas baking"
    sources: ["https://www.thelocal.se/20111230/38248", "https://www.sverigesradio.se/artikel/4885650"]
  - claim: "Years later the family pulled up the kitchen floor during a renovation looking for it"
    sources: ["https://www.thelocal.se/20111230/38248", "https://www.sverigesradio.se/artikel/4885650"]
  - claim: "In October 2011 she found it wrapped around a small carrot; she almost threw the carrot away"
    sources: ["https://www.sverigesradio.se/artikel/4885650", "https://www.thelocal.se/20111230/38248"]
  - claim: "It probably went into the compost with kitchen scraps; the ring no longer fit and had to be resized"
    sources: ["https://www.thelocal.se/20111230/38248", "https://www.snopes.com/long-lost-wedding-ring-found-around-carrot/"]

