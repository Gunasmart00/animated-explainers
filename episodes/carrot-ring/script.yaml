cover_text: "16 YEARS LATER"
alt_text: "3D animation: a woman in Sweden pulls a tiny carrot from her garden and finds her wedding ring wrapped around it, 16 years after losing it while baking; a cutaway shows it went into the compost and a carrot grew through it; in the end the ring no longer fits her finger."
