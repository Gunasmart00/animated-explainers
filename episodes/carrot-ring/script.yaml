caption: |
  She found her lost wedding ring... on a carrot 😮
  It had been missing for 16 years.

  Follow @howzit.explains for true stories you won't believe.
  How do YOU think it got there? 👇
hashtags: [weddingring, lostandfound, truestory, sweden, wholesome]
