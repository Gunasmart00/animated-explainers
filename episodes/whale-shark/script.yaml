cover_text: "SAVED BY A WHALE"
alt_text: "3D animation: a humpback whale keeps pushing a snorkelling scientist and tucks her under its fin; back at her boat she sees a tiger shark nearby while a second whale slaps its tail; a year later the same whale, known by the notches in its tail, swims up to her boat and nudges her."
