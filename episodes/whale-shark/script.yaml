facts:
  - claim: "In 2017 off Rarotonga, Cook Islands, a humpback of about 23 tonnes pushed whale biologist Nan Hauser (28 years of research) for over ten minutes, tucked her under its pectoral fin and lifted her out of the water"
    sources: ["https://www.newshub.co.nz/home/world/2018/01/humpback-whale-protects-diver-from-nearby-tiger-shark.amp.html", "https://www.nationalgeographic.com/animals/article/whale-protects-diver-from-shark-video-spd"]
  - claim: "A tiger shark of about 4.5 m was nearby; a second whale slapped its tail; she was bruised"
    sources: ["https://www.newshub.co.nz/home/world/2018/01/humpback-whale-protects-diver-from-nearby-tiger-shark.amp.html", "https://foxnews.com/science/hero-whale-saves-snorkeler-from-tiger-shark-in-the-pacific-ocean.amp"]
  - claim: "Humpbacks are known to protect other species, such as seals, from killer whales"
    sources: ["https://www.nationalgeographic.com/animals/article/whale-protects-diver-from-shark-video-spd", "https://mymodernmet.com/humpback-whale-saves-scientist/"]
  - claim: "About a year later a whale with two notches in its fluke and a head scar swam to her boat, ignored the others and nudged her"
    sources: ["https://www.iflscience.com/scientist-reunites-with-whale-that-protected-her-from-huge-shark-71326", "https://mymodernmet.com/humpback-whale-saves-scientist/"]

