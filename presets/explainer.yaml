# HowZit 3D explainer in the style of the owner's Zack D. Films reference Reels (analysis: docs/zack-style-analysis.md).
# 1080x1920, Google Flow (Veo) clips with their own sound effects, ElevenLabs narration, 1-3 word white captions,
# glowing pop-up numbers, no music (turn it on for design/engineering episodes), HowZit logo only.
video:
  width: 1080
  height: 1920
  fps: 30

voice:
  engine: edge          # fallback when there's no `voiceover:` file (ElevenLabs is the main voice; see prompts/elevenlabs.md)
  name: en-US-BrianMultilingualNeural   # owner pick 2026-10-18
  rate: "+14%"          # the reference speaks 4.3-5.1 syllables a second; Brian at +10% is ~4.1 (2026-10-18 analysis)
  pitch: "+0Hz"
  # Compare voices by ear:  python -m studio.voices   (writes voice-tests\*.mp3)

scene:
  pad_after: 0.05       # near-continuous narration, like the reference (about 1 pause per 10 s)
  default_motion: zoom_in
  zoom: 0.06            # slow, subtle camera push
  background: ground    # placeholder and end-card background

captions:               # reference look: white, heavy humanist sans, thin dark edge + soft shadow, no highlight
  font: Open Sans ExtraBold
  bold: false           # the font file is already the heavy weight
  size: 100
  color: white
  outline_color: "#000000"
  outline: 3
  shadow: 3
  shadow_color: "#000000"
  shadow_opacity: 0.45
  blur: 1.2             # softens the edge like the reference
  words_per_line: 3
  position_y: 0.78      # centre of a 1-line caption; all 8 reference Reels measure 78% (y ~1500). 2 lines grow upward
  uppercase: false
  highlight_color: null # set to lime for the brand's spoken-word highlight

popups:                 # big numbers/words that appear when spoken
  font: Open Sans ExtraBold
  size: 200
  position_y: 0.36
  hold: 1.6
  default_color: white
  glow: true            # soft lime glow, like the reference's glowing numbers
  outline: 0

music:
  file: null            # off: the reference Reels have no music. For design/engineering episodes set
                        # `overrides: {music: {file: auto}}` (uses assets\music\ or the episode's audio\music.*)
  volume: 0.16
  duck: true

clip_audio:             # the sound effects Google Flow (Veo) generates inside each clip
  enabled: true
  volume: 0.9
  duck: true            # dips a little while the narrator speaks

sfx:
  cuts: null            # owner 2026-10-18: NO whoosh on scene changes (sounded odd); clips carry their own Flow sound effects
  popups: pop           # pop when a number or word pops up; a pop-up can set `sfx: ding`, `sfx: impact` or `sfx: none`
  reveal: impact        # deep thud under the lime pop-up (the one reveal), like the reference's sub-bass hits
  volume: 0.32          # the reference mixes its effects loud and punchy

loudness: -14           # LUFS for the final mix (all 8 reference Reels measure -14.1 to -14.2)

quality:
  upscale: auto         # auto = use Real-ESRGAN if installed (tools\realesrgan\), else high-quality Lanczos
  crf: 16               # lower = higher quality (16 is visually lossless for this content)
  preset: slow
